<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maintenance in Progress</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column; /* added so footer can sit at bottom */
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
      position: relative; /* for absolute footer */
    }

    .container {
      background-color: var(--card-bg);
      padding: 3.5rem 2.5rem;
      border-radius: 1.5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      max-width: 680px;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.05);
      margin-bottom: 12px; /* space for footer */
    }

    .icon-wrapper {
      margin-bottom: 2rem;
      display: inline-block;
    }

    .icon-wrapper svg {
      width: 80px;
      height: 80px;
      stroke: var(--accent-color);
    }

    h1 {
      font-size: clamp(2.25rem, 5vw, 3.5rem);
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 1.25rem;
      letter-spacing: -0.025em;
      background: linear-gradient(135deg, #ffffff 0%, var(--accent-color) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      font-size: clamp(1.25rem, 3vw, 1.75rem);
      color: var(--text-muted);
      font-weight: 400;
      line-height: 1.4;
      max-width: 28ch;
      margin: 0 auto;
    }

    .pulse-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      background-color: var(--accent-color);
      border-radius: 50%;
      margin-right: 8px;
      box-shadow: 0 0 12px var(--accent-color);
      animation: pulse 2s infinite;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent-color);
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 15px;
    }

    /* FIXED .end styles */
    .end {
      position: absolute;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
    }

    .end a {
      color: var(--accent-color);
      text-decoration: none;
      margin-left: 6px;
      transition: opacity 0.2s;
    }

    .end a:hover {
      opacity: 0.8;
      text-decoration: underline;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
  </style>
</head>
<body>

  <main class="container">
    <div class="status-badge">
      <span class="pulse-dot"></span> System Update
    </div>
    
    <div class="icon-wrapper">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M11.42 15.17 17.25 21A2.652 2.652 0 0 0 21 17.25l-5.877-5.877M11.42 15.17l2.496-3.03c.317-.384.74-.626 1.208-.766M11.42 15.17l-4.655 5.653a2.548 2.548 0 1 1-3.586-3.586l5.654-4.654m0 0a3 3 0 0 1-.362-3.82l.006-.007a3 3 0 0 1 3.593-.578l3.197 3.197M12.75 3a3 3 0 0 1 3.82.362l.007.006a3 3 0 0 1 .578 3.593l-3.197 3.197" />
      </svg>
    </div>

    <h1>Maintenance in Progress</h1>
    <p>Updated web service will be launched shortly.</p>
  </main>
  
  <div class="end">
    <span>Getting created by Vision Studios</span>
    <a href="https://sentinelcoredev.github.io/visionstudios_demo/" target="_blank" rel="noopener noreferrer">View Site here</a>
  </div>

</body>
</html>
